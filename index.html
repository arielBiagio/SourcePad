<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>terminal://chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tailwind.css">
<script src="/assets/marked.umd.js"></script>
<script src="/assets/purify.min.js"></script>
<style>
  :root{
    --bg: #0B0E14;
    --surface: #11151D;
    --surface-2: #161B26;
    --border: #232B3A;
    --text: #E6EAF2;
    --text-dim: #6B7688;
    --accent: #7C9CFF;
    --accent-dim: #3A4468;
    --ok: #5EEAD4;
  }
  *{ font-family: 'Space Grotesk', sans-serif; }
  .mono{ font-family: 'JetBrains Mono', monospace; }
  body{ background: var(--bg); }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 8px; }

  .scanline{
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(124,156,255,0.015) 3px
    );
  }

  .msg-in{
    animation: msgIn .35s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes msgIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .cursor-blink{
    animation: blink 1s step-start infinite;
  }
  @keyframes blink{
    50%{ opacity: 0; }
  }

  .dot{
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2){ animation-delay: .15s; }
  .dot:nth-child(3){ animation-delay: .3s; }
  @keyframes dotPulse{
    0%,60%,100%{ opacity: .25; transform: scale(.85); }
    30%{ opacity: 1; transform: scale(1); }
  }

  .glow-border:focus-within{
    box-shadow: 0 0 0 1px var(--accent), 0 0 24px -4px rgba(124,156,255,0.35);
  }

  textarea{ field-sizing: content; }

  /* Formato para el Markdown parseado dentro de las burbujas del asistente */
  .markdown-content{ }
  .markdown-content p{ margin: 0 0 0.6em 0; }
  .markdown-content p:last-child{ margin-bottom: 0; }
  .markdown-content strong{ color: var(--text); font-weight: 700; }
  .markdown-content em{ font-style: italic; }
  .markdown-content ul, .markdown-content ol{ margin: 0 0 0.6em 0; padding-left: 1.25em; }
  .markdown-content ul{ list-style: disc; }
  .markdown-content ol{ list-style: decimal; }
  .markdown-content li{ margin-bottom: 0.2em; }
  .markdown-content li:last-child{ margin-bottom: 0; }
  .markdown-content a{ color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .markdown-content code{
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85em;
    background: rgba(124,156,255,0.12);
    border: 1px solid var(--border);
    padding: 0.1em 0.35em;
    border-radius: 4px;
  }
  .markdown-content pre{
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75em 1em;
    overflow-x: auto;
    margin: 0 0 0.6em 0;
  }
  .markdown-content pre code{
    background: none;
    border: none;
    padding: 0;
  }
  .markdown-content blockquote{
    border-left: 2px solid var(--accent);
    padding-left: 0.75em;
    margin: 0 0 0.6em 0;
    color: var(--text-dim);
  }
  .markdown-content h1, .markdown-content h2, .markdown-content h3{
    font-weight: 700;
    margin: 0.4em 0 0.4em 0;
  }
  .markdown-content hr{ border: none; border-top: 1px solid var(--border); margin: 0.6em 0; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 scanline">

  <div class="w-full max-w-2xl h-[85vh] flex flex-col rounded-2xl border overflow-hidden" style="background: var(--surface); border-color: var(--border);">

    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b" style="border-color: var(--border); background: var(--surface-2);">
      <div class="flex items-center gap-3">
        <div class="relative w-2.5 h-2.5">
          <span id="statusDot" class="absolute inset-0 rounded-full" style="background: var(--ok);"></span>
          <span id="statusPing" class="absolute inset-0 rounded-full animate-ping" style="background: var(--ok); opacity:.6;"></span>
        </div>
        <div>
          <p class="text-sm font-semibold tracking-tight" style="color: var(--text);">sesión activa</p>
          <p class="mono text-[11px]" style="color: var(--text-dim);" id="statusText">/api/chat</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/notebooks.html" class="mono text-[11px] px-2 py-1.5" style="color: var(--accent);">cuadernos</a>
        <span id="userName" class="mono text-[10px] max-w-28 truncate hidden sm:inline" style="color: var(--text-dim);"></span>
        <button id="logoutBtn" class="mono text-[11px] px-2.5 py-1.5 rounded-lg border transition-colors hover:opacity-100" style="border-color: var(--border); color: var(--text-dim);" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">
          salir
        </button>
        <button id="clearBtn" class="mono text-[11px] px-2.5 py-1.5 rounded-lg border transition-colors hover:opacity-100" style="border-color: var(--border); color: var(--text-dim);" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">
          limpiar
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages" class="flex-1 overflow-y-auto px-5 py-6 flex flex-col gap-5">
      <div class="msg-in flex flex-col gap-1.5 max-w-[85%]">
        <span class="mono text-[10px] uppercase tracking-wider" style="color: var(--text-dim);">sistema</span>
        <div class="rounded-xl rounded-tl-sm px-4 py-3 border text-sm leading-relaxed" style="background: var(--surface-2); border-color: var(--border); color: var(--text-dim);">
          Escribí un mensaje abajo. Se enviará por <span class="mono" style="color: var(--accent);">POST</span> a
          <span class="mono" style="color: var(--accent);">/api/chat</span> y se pintará la respuesta del campo
          <span class="mono" style="color: var(--accent);">respuesta</span>.
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="p-4 border-t" style="border-color: var(--border); background: var(--surface-2);">
      <form id="chatForm" class="flex items-end gap-2 rounded-xl border px-3 py-2 transition-shadow glow-border" style="background: var(--bg); border-color: var(--border);">
        <span class="mono text-sm pb-1.5 select-none" style="color: var(--accent);">&gt;</span>
        <textarea
          id="userInput"
          rows="1"
          placeholder="Escribí tu mensaje..."
          class="flex-1 bg-transparent resize-none outline-none text-sm py-1.5 max-h-32"
          style="color: var(--text);"
        ></textarea>
        <button
          type="submit"
          id="sendBtn"
          class="flex items-center justify-center w-9 h-9 rounded-lg shrink-0 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
          style="background: var(--accent); color: var(--bg);"
        >
          <svg id="sendIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
        <button
          type="button"
          id="cancelBtn"
          class="hidden items-center justify-center w-9 h-9 rounded-lg shrink-0 transition-all border"
          style="background: var(--surface-2); border-color: #F87171; color: #F87171;"
          title="Detener generación"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <rect x="5" y="5" width="14" height="14" rx="2"></rect>
          </svg>
        </button>
      </form>
      <p class="mono text-[10px] mt-2 px-1" style="color: var(--text-dim);">Enter para enviar · Shift+Enter para salto de línea</p>
    </div>

  </div>

<script>
  // URL relativa: evita CORS y usa el mismo origen que sirve este frontend.
  const API_URL = '/api/chat';
  const API_LABEL = `${window.location.host}/api/chat`;

  // Memoria de la conversación (Sliding Window) — el backend espera este historial completo en cada request
  let historialDeMensajes = [];

  // Cola de caracteres pendientes de pintar (efecto máquina de escribir) y el id del intervalo que la vacía
  let colaDeTexto = '';
  let typewriterIntervalId = null;

  // Controlador para poder cancelar el fetch de streaming en curso
  let abortController = null;

  // Referencia a la función que corta la generación actual (funciona aunque el fetch ya haya terminado
  // y solo quede corriendo la animación de la máquina de escribir)
  let cancelarGeneracionActual = null;

  // Scroll inteligente: si el usuario sube a leer mensajes viejos, dejamos de forzar el scroll al fondo
  let autoScrollActivo = true;
  const UMBRAL_SCROLL_PX = 48;

  const form = document.getElementById('chatForm');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const sendIcon = document.getElementById('sendIcon');
  const messages = document.getElementById('messages');
  const clearBtn = document.getElementById('clearBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userName = document.getElementById('userName');
  const statusDot = document.getElementById('statusDot');
  const statusPing = document.getElementById('statusPing');
  const statusText = document.getElementById('statusText');

  // auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 128) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  clearBtn.addEventListener('click', () => {
    messages.innerHTML = '';
    historialDeMensajes = [];
    autoScrollActivo = true;
  });

  // Detecta si el usuario está leyendo mensajes anteriores (scrolleó hacia arriba)
  messages.addEventListener('scroll', () => {
    const distanciaAlFondo = messages.scrollHeight - messages.scrollTop - messages.clientHeight;
    autoScrollActivo = distanciaAlFondo <= UMBRAL_SCROLL_PX;
  });

  function scrollToBottom() {
    if (!autoScrollActivo) return;
    messages.scrollTop = messages.scrollHeight;
  }

  function addMessage({ role, text }) {
    const wrapper = document.createElement('div');
    wrapper.className = `msg-in flex flex-col gap-1.5 max-w-[85%] ${role === 'user' ? 'items-end self-end' : 'items-start self-start'}`;

    const label = document.createElement('span');
    label.className = 'mono text-[10px] uppercase tracking-wider';
    label.style.color = 'var(--text-dim)';
    label.textContent = role === 'user' ? 'vos' : 'asistente';

    const bubble = document.createElement('div');
    bubble.className = `rounded-xl px-4 py-3 border text-sm leading-relaxed ${role === 'user' ? 'rounded-tr-sm whitespace-pre-wrap' : 'rounded-tl-sm markdown-content'}`;

    if (role === 'user') {
      bubble.style.background = 'var(--accent-dim)';
      bubble.style.borderColor = 'var(--accent)';
      bubble.style.color = 'var(--text)';
    } else {
      bubble.style.background = 'var(--surface-2)';
      bubble.style.borderColor = 'var(--border)';
      bubble.style.color = 'var(--text)';
    }

    bubble.textContent = text;
    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    messages.appendChild(wrapper);
    scrollToBottom();
    return bubble;
  }

  function addLoadingBubble() {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-in flex flex-col gap-1.5 max-w-[85%] items-start self-start';
    wrapper.id = 'loadingBubble';

    const label = document.createElement('span');
    label.className = 'mono text-[10px] uppercase tracking-wider';
    label.style.color = 'var(--text-dim)';
    label.textContent = 'asistente';

    const bubble = document.createElement('div');
    bubble.className = 'rounded-xl rounded-tl-sm px-4 py-3.5 border flex items-center gap-1.5';
    bubble.style.background = 'var(--surface-2)';
    bubble.style.borderColor = 'var(--border)';

    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot w-1.5 h-1.5 rounded-full';
      dot.style.background = 'var(--text-dim)';
      bubble.appendChild(dot);
    }

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    messages.appendChild(wrapper);
    scrollToBottom();
  }

  function removeLoadingBubble() {
    const el = document.getElementById('loadingBubble');
    if (el) el.remove();
  }

  function setStatus(state) {
    // state: 'idle' | 'loading' | 'error'
    if (state === 'loading') {
      statusDot.style.background = 'var(--accent)';
      statusPing.style.background = 'var(--accent)';
      statusText.textContent = 'esperando respuesta...';
    } else if (state === 'error') {
      statusDot.style.background = '#F87171';
      statusPing.style.background = '#F87171';
      statusText.textContent = 'error de conexión';
    } else {
      statusDot.style.background = 'var(--ok)';
      statusPing.style.background = 'var(--ok)';
      statusText.textContent = API_LABEL;
    }
  }

  function setLoadingUI(isLoading) {
    sendBtn.disabled = isLoading;
    input.disabled = isLoading;
    sendIcon.style.opacity = isLoading ? '0' : '1';

    if (isLoading) {
      sendBtn.classList.add('hidden');
      cancelBtn.classList.remove('hidden');
      cancelBtn.classList.add('flex');
    } else {
      sendBtn.classList.remove('hidden');
      cancelBtn.classList.add('hidden');
      cancelBtn.classList.remove('flex');
    }
  }

  async function sendMessage(text) {
    setLoadingUI(true);
    setStatus('loading');
    addLoadingBubble();

    // Guardamos el turno del usuario en la memoria antes de enviar el request
    historialDeMensajes.push({ role: 'user', content: text });

    // Nuevo controlador para este request: permite cortar el fetch de streaming en cualquier momento
    abortController = new AbortController();

    let respuestaDeLaIA = '';   // texto completo real (markdown crudo), tal cual llega del backend
    let textoPintado = '';      // subconjunto de respuestaDeLaIA ya revelado letra por letra en pantalla
    let bubbleActiva = null;    // burbuja del DOM donde se va pintando letra por letra
    let streamFinalizado = false;
    let generacionCancelada = false; // evita que se cierre dos veces si se cancela y además dispara AbortError
    colaDeTexto = '';

    // Vacía colaDeTexto un carácter a la vez, con un intervalo corto, para el efecto máquina de escribir
    function iniciarTypewriter() {
      if (typewriterIntervalId !== null) return; // ya está corriendo, no duplicar el intervalo

      typewriterIntervalId = setInterval(() => {
        if (colaDeTexto.length > 0) {
          const siguienteCaracter = colaDeTexto.charAt(0);
          colaDeTexto = colaDeTexto.slice(1);
          textoPintado += siguienteCaracter;

          // Re-parseamos el Markdown acumulado hasta ahora y lo pintamos como HTML real
          bubbleActiva.innerHTML = DOMPurify.sanitize(marked.parse(textoPintado));
          scrollToBottom();
        } else if (streamFinalizado) {
          // ya no quedan letras por pintar y el backend terminó de mandar el stream: cerramos todo
          clearInterval(typewriterIntervalId);
          typewriterIntervalId = null;

          historialDeMensajes.push({ role: 'assistant', content: respuestaDeLaIA });
          setStatus('idle');
          setLoadingUI(false);
          input.focus();

          // Recién ahora la generación terminó de verdad: soltamos las referencias de cancelación
          abortController = null;
          cancelarGeneracionActual = null;
        }
      }, 20); // ajustable entre 15ms y 30ms
    }

    // Se llama cuando el usuario aprieta "Cancelar": corta todo de forma prolija, sea cual sea el estado
    // del fetch (en vuelo o ya terminado) y cierra el historial. Sirve tanto para el click directo del
    // usuario como para cuando el AbortController efectivamente corta un fetch que seguía en curso.
    function finalizarPorCancelacion() {
      if (generacionCancelada) return; // ya se cerró por este mismo motivo, no lo hacemos dos veces
      generacionCancelada = true;

      if (abortController) {
        abortController.abort(); // por si el fetch/reader seguían en vuelo
      }

      if (typewriterIntervalId) {
        clearInterval(typewriterIntervalId);
        typewriterIntervalId = null;
      }
      colaDeTexto = ''; // descartamos lo que quedaba pendiente de animar

      if (!bubbleActiva) {
        // el usuario canceló antes de que llegara el primer fragmento
        removeLoadingBubble();
      } else {
        // mostramos de una todo lo que alcanzamos a recibir, sin esperar a que el typewriter lo termine de revelar
        bubbleActiva.innerHTML = DOMPurify.sanitize(marked.parse(respuestaDeLaIA));
      }

      // Guardamos en la memoria solo lo que realmente se generó (si hubo algo)
      if (respuestaDeLaIA) {
        historialDeMensajes.push({ role: 'assistant', content: respuestaDeLaIA });
      }

      setStatus('idle');
      setLoadingUI(false);
      input.focus();

      abortController = null;
      cancelarGeneracionActual = null;
    }

    // Mientras esta generación esté activa, el botón de cancelar puede llamar a esta función en cualquier momento
    cancelarGeneracionActual = finalizarPorCancelacion;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ historial: historialDeMensajes }),
        signal: abortController.signal
      });

      if (!res.ok) {
        if (res.status === 401) window.location.replace('/auth.html');
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.error || `HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        if (!chunk) continue;

        respuestaDeLaIA += chunk;
        colaDeTexto += chunk;

        // En cuanto llega el primer fragmento, apagamos el loading y arrancamos la burbuja real
        if (!bubbleActiva) {
          removeLoadingBubble();
          bubbleActiva = addMessage({ role: 'assistant', text: '' });
        }

        iniciarTypewriter();
      }

      // Por si el stream terminó sin mandar ningún fragmento
      if (!bubbleActiva) {
        removeLoadingBubble();
        bubbleActiva = addMessage({ role: 'assistant', text: '' });
      }

      streamFinalizado = true;
      iniciarTypewriter(); // asegura que el intervalo quede corriendo hasta drenar la cola y cerrar
      // OJO: acá NO tocamos abortController ni cancelarGeneracionActual — el typewriter puede seguir
      // animando texto varios segundos más, y el botón de cancelar tiene que seguir funcionando hasta
      // que termine de verdad (eso se resuelve dentro del propio intervalo, arriba).
    } catch (err) {
      if (err.name === 'AbortError') {
        // Cancelación intencional del usuario: cerramos todo de forma prolija, sin mostrarlo como error
        finalizarPorCancelacion();
        return;
      }

      if (typewriterIntervalId) {
        clearInterval(typewriterIntervalId);
        typewriterIntervalId = null;
      }
      removeLoadingBubble();
      addMessage({
        role: 'assistant',
        text: `No se pudo conectar con ${API_URL}.\nDetalle: ${err.message}`
      });
      setStatus('error');
      setLoadingUI(false);
      input.focus();

      abortController = null;
      cancelarGeneracionActual = null;
    }
  }

  cancelBtn.addEventListener('click', () => {
    if (cancelarGeneracionActual) {
      cancelarGeneracionActual();
    }
  });

  logoutBtn.addEventListener('click', async () => {
    logoutBtn.disabled = true;

    try {
      const response = await fetch('/api/auth/sign-out', {
        method: 'POST',
        credentials: 'same-origin'
      });
      if (!response.ok) throw new Error('No se pudo cerrar la sesión.');
      window.location.replace('/auth.html');
    } catch (error) {
      statusText.textContent = error.message;
      logoutBtn.disabled = false;
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    autoScrollActivo = true; // al mandar un mensaje nuevo, siempre volvemos a seguir el flujo del chat
    addMessage({ role: 'user', text });
    input.value = '';
    input.style.height = 'auto';
    sendMessage(text);
  });

  async function initializeSession() {
    try {
      const response = await fetch('/api/me', { credentials: 'same-origin' });

      if (!response.ok) {
        window.location.replace('/auth.html');
        return;
      }

      const session = await response.json();
      userName.textContent = session.user?.name || session.user?.email || 'sesión activa';
      input.focus();
    } catch (error) {
      setStatus('error');
      statusText.textContent = 'no se pudo validar la sesión';
    }
  }

  initializeSession();
</script>
</body>
</html>
