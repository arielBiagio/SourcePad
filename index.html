<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>terminal://chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tailwind.css">
<script src="/assets/marked.umd.js"></script>
<script src="/assets/purify.min.js"></script>
<style>
  :root{
    --bg: #0B0E14;
    --surface: #11151D;
    --surface-2: #161B26;
    --border: #232B3A;
    --text: #E6EAF2;
    --text-dim: #6B7688;
    --accent: #7C9CFF;
    --accent-dim: #3A4468;
    --ok: #5EEAD4;
  }
  *{ font-family: 'Space Grotesk', sans-serif; }
  .mono{ font-family: 'JetBrains Mono', monospace; }
  body{ background: var(--bg); }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 8px; }

  .scanline{
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(124,156,255,0.015) 3px
    );
  }

  .msg-in{
    animation: msgIn .35s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes msgIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .cursor-blink{
    animation: blink 1s step-start infinite;
  }
  @keyframes blink{
    50%{ opacity: 0; }
  }

  .dot{
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2){ animation-delay: .15s; }
  .dot:nth-child(3){ animation-delay: .3s; }
  @keyframes dotPulse{
    0%,60%,100%{ opacity: .25; transform: scale(.85); }
    30%{ opacity: 1; transform: scale(1); }
  }

  .glow-border:focus-within{
    box-shadow: 0 0 0 1px var(--accent), 0 0 24px -4px rgba(124,156,255,0.35);
  }

  textarea{ field-sizing: content; }

  /* Formato para el Markdown parseado dentro de las burbujas del asistente */
  .markdown-content{ }
  .markdown-content p{ margin: 0 0 0.6em 0; }
  .markdown-content p:last-child{ margin-bottom: 0; }
  .markdown-content strong{ color: var(--text); font-weight: 700; }
  .markdown-content em{ font-style: italic; }
  .markdown-content ul, .markdown-content ol{ margin: 0 0 0.6em 0; padding-left: 1.25em; }
  .markdown-content ul{ list-style: disc; }
  .markdown-content ol{ list-style: decimal; }
  .markdown-content li{ margin-bottom: 0.2em; }
  .markdown-content li:last-child{ margin-bottom: 0; }
  .markdown-content a{ color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .markdown-content code{
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85em;
    background: rgba(124,156,255,0.12);
    border: 1px solid var(--border);
    padding: 0.1em 0.35em;
    border-radius: 4px;
  }
  .markdown-content pre{
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75em 1em;
    overflow-x: auto;
    margin: 0 0 0.6em 0;
  }
  .markdown-content pre code{
    background: none;
    border: none;
    padding: 0;
  }
  .markdown-content blockquote{
    border-left: 2px solid var(--accent);
    padding-left: 0.75em;
    margin: 0 0 0.6em 0;
    color: var(--text-dim);
  }
  .markdown-content h1, .markdown-content h2, .markdown-content h3{
    font-weight: 700;
    margin: 0.4em 0 0.4em 0;
  }
  .markdown-content hr{ border: none; border-top: 1px solid var(--border); margin: 0.6em 0; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 scanline">

  <div class="w-full max-w-2xl h-[85vh] flex flex-col rounded-2xl border overflow-hidden" style="background: var(--surface); border-color: var(--border);">

    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b" style="border-color: var(--border); background: var(--surface-2);">
      <div class="flex items-center gap-3">
        <div class="relative w-2.5 h-2.5">
          <span id="statusDot" class="absolute inset-0 rounded-full" style="background: var(--ok);"></span>
          <span id="statusPing" class="absolute inset-0 rounded-full animate-ping" style="background: var(--ok); opacity:.6;"></span>
        </div>
        <div>
          <p class="text-sm font-semibold tracking-tight" style="color: var(--text);">sesión activa</p>
          <p class="mono text-[11px]" style="color: var(--text-dim);" id="statusText">/api/chat</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/notebooks.html" class="mono text-[11px] px-2 py-1.5" style="color: var(--accent);">cuadernos</a>
        <span id="userName" class="mono text-[10px] max-w-28 truncate hidden sm:inline" style="color: var(--text-dim);"></span>
        <button id="logoutBtn" class="mono text-[11px] px-2.5 py-1.5 rounded-lg border transition-colors hover:opacity-100" style="border-color: var(--border); color: var(--text-dim);" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">
          salir
        </button>
        <button id="clearBtn" class="mono text-[11px] px-2.5 py-1.5 rounded-lg border transition-colors hover:opacity-100" style="border-color: var(--border); color: var(--text-dim);" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">
          limpiar
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages" class="flex-1 overflow-y-auto px-5 py-6 flex flex-col gap-5">
      <div class="msg-in flex flex-col gap-1.5 max-w-[85%]">
        <span class="mono text-[10px] uppercase tracking-wider" style="color: var(--text-dim);">sistema</span>
        <div class="rounded-xl rounded-tl-sm px-4 py-3 border text-sm leading-relaxed" style="background: var(--surface-2); border-color: var(--border); color: var(--text-dim);">
          Escribí un mensaje abajo. Se enviará por <span class="mono" style="color: var(--accent);">POST</span> a
          <span class="mono" style="color: var(--accent);">/api/chat</span> y se pintará la respuesta del campo
          <span class="mono" style="color: var(--accent);">respuesta</span>.
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="p-4 border-t" style="border-color: var(--border); background: var(--surface-2);">
      <form id="chatForm" class="flex items-end gap-2 rounded-xl border px-3 py-2 transition-shadow glow-border" style="background: var(--bg); border-color: var(--border);">
        <span class="mono text-sm pb-1.5 select-none" style="color: var(--accent);">&gt;</span>
        <textarea
          id="userInput"
          rows="1"
          placeholder="Escribí tu mensaje..."
          class="flex-1 bg-transparent resize-none outline-none text-sm py-1.5 max-h-32"
          style="color: var(--text);"
        ></textarea>
        <button
          type="submit"
          id="sendBtn"
          class="flex items-center justify-center w-9 h-9 rounded-lg shrink-0 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
          style="background: var(--accent); color: var(--bg);"
        >
          <svg id="sendIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
        <button
          type="button"
          id="cancelBtn"
          class="hidden items-center justify-center w-9 h-9 rounded-lg shrink-0 transition-all border"
          style="background: var(--surface-2); border-color: #F87171; color: #F87171;"
          title="Detener generación"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <rect x="5" y="5" width="14" height="14" rx="2"></rect>
          </svg>
        </button>
      </form>
      <p class="mono text-[10px] mt-2 px-1" style="color: var(--text-dim);">Enter para enviar · Shift+Enter para salto de línea</p>
    </div>

  </div>

<script type="module" src="/assets/general-chat.js?v=20261016-cleanup"></script>
</body>
</html>
