<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · SourcePad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/theme.css?v=20261018-sourcepad-scrollbars">
  <link rel="stylesheet" href="/assets/auth.css?v=20261018">
  <script type="module" src="/assets/auth.js?v=20261018-sourcepad"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand" href="/index.html"><span class="brand-icon">&gt;_</span><span>SourcePad</span></a>
    <div class="auth-tabs" role="tablist" aria-label="Acceso">
      <button id="signInTab" type="button" role="tab" aria-selected="true" class="tab-active" aria-controls="signInForm" disabled>Iniciar sesión</button>
      <button id="signUpTab" type="button" role="tab" aria-selected="false" aria-controls="signUpForm" disabled>Crear cuenta</button>
    </div>
    <h1 id="authTitle">Iniciar sesión</h1>
    <span id="connectionStatus" class="sr-only" role="status"></span>
    <form id="signInForm" novalidate aria-labelledby="authTitle">
      <label>Email<span class="auth-field"><input id="signInEmail" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="vos@ejemplo.com"></span></label>
      <label>Contraseña<span class="auth-field"><input id="signInPassword" name="password" type="password" autocomplete="current-password" maxlength="128" required></span></label>
      <label class="remember"><input type="checkbox" name="remember">Recordarme</label>
      <button type="submit" class="primary submit-button" disabled>Entrar al chat</button>
    </form>
    <form id="signUpForm" class="hidden" novalidate aria-labelledby="authTitle">
      <label>Nombre<span class="auth-field"><input id="signUpName" name="name" type="text" autocomplete="name" maxlength="100" required></span></label>
      <label>Email<span class="auth-field"><input id="signUpEmail" name="email" type="email" autocomplete="email" maxlength="254" required></span></label>
      <label>Contraseña<span class="auth-field"><input id="signUpPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></span></label>
      <button type="submit" class="primary submit-button" disabled>Crear cuenta</button>
    </form>
    <p id="authFeedback" class="auth-feedback is-info" aria-live="polite"></p>
  </main>
</body>
</html>
